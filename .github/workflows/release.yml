name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to release (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Resolve tag information
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if ! printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$'; then
            echo "❌ Invalid tag: $TAG"
            echo "Tag must be v<semver>, e.g. v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          VERSION="${TAG#v}"

          # Only a SemVer pre-release suffix marks the release as a pre-release.
          # A hyphen in build metadata (v1.2.3+build-1) does not.
          if printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'is_prerelease=%s\n' "$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "🏷️ Tag: $TAG"
          echo "📦 Version: $VERSION"
          echo "🧪 Pre-release: $IS_PRERELEASE"

      - name: Compute changelog range
        id: changelog_range
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Pick the nearest stable SemVer tag reachable from the released tag.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$TAG"
          else
            RANGE="$TAG"
          fi
          printf 'range=%s\n' "$RANGE" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RANGE: ${{ steps.changelog_range.outputs.range }}
        run: |
          git-cliff --tag "$TAG" \
            --config cliff.toml \
            --output release_notes.md \
            "$RANGE"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          ARGS=(--verify-tag --title "v$VERSION" --notes-file release_notes.md)
          if [ "$IS_PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$TAG" "${ARGS[@]}"
